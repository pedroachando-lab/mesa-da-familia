name: Aviso do jantar

on:
  schedule:
    - cron: '5 11,12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Enviar já um aviso de teste'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  aviso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Enviar aviso
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ inputs.force }}
          APP_URL: ${{ vars.APP_URL }}
        run: node aviso-jantar.mjs
      - name: Manter o aviso ativo
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Manter o aviso diário ativo"
            git push
          fi
