<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-dJq0HuyBurAIAssZM3V/q6qENiYDceKsKF4E2GYyrH8=' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com; frame-src https://*.firebaseapp.com; worker-src 'self'; manifest-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesa da Família</title>
<meta name="description" content="Receitas para o almoço e jantar da família e lista de compras partilhada.">
<meta name="theme-color" content="#F3F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111612" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mesa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de telemóvel numa coluna (máx. 720px), cabeçalho fixo em cima, separadores em baixo, folhas deslizantes para receitas */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --surface-2:#E7EBE2; --ink:#1C2620; --muted:#5E6B62; --line:#D5DBCF;
  --basil:#2F5D3A; --basil-ink:#FFFFFF; --tomato:#C8432B; --tomato-ink:#FFFFFF; --done:#DCE1D6; --done-ink:#56635A;
  --warn:#9A5B00; --shadow:0 1px 2px rgba(28,38,32,.08),0 6px 18px rgba(28,38,32,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111612; --surface:#1A211C; --surface-2:#242D27; --ink:#E6ECE4; --muted:#9AA79E; --line:#2F3A32;
  --basil:#6FAE7C; --basil-ink:#0E1A11; --tomato:#C24A33; --tomato-ink:#FFFFFF; --done:#232B25; --done-ink:#9AA79E;
  --warn:#E0A44A; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111612; --surface:#1A211C; --surface-2:#242D27; --ink:#E6ECE4; --muted:#9AA79E; --line:#2F3A32;
  --basil:#6FAE7C; --basil-ink:#0E1A11; --tomato:#C24A33; --tomato-ink:#FFFFFF; --done:#232B25; --done-ink:#9AA79E;
  --warn:#E0A44A; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--basil);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0;flex:1}
.brand span{color:var(--tomato)}
.mode{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.mode.live i{background:var(--basil)}
.mode.local i{background:var(--warn)}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:18px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;white-space:nowrap;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 18px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--basil);color:var(--basil-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--tomato);border:1px solid var(--tomato)}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;color:var(--basil);font-weight:600;padding:4px 0}

/* Sugestões */
.today{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.today .em{font-size:30px}
.today > div{flex:1;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.card .em{flex:none;width:56px;height:56px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:30px}
.card > div{min-width:0;flex:1}
.card h3{line-height:1.2}
.meta{font-size:13px;color:var(--muted);margin-top:3px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:4px}
.planned{color:var(--basil);font-weight:600}
.tag.hot{color:var(--tomato);border-color:var(--tomato)}
.tag.ok{color:var(--basil);border-color:var(--basil)}
.healthy{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:700}
.healthy small{grid-column:2;font-weight:500;color:var(--muted);font-size:12px}
.healthy .sw{grid-row:span 2;width:40px;height:24px;border-radius:12px;background:var(--surface-2);position:relative;transition:background .15s}
.healthy .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s}
.healthy[aria-pressed="true"]{border-color:var(--basil)}
.healthy[aria-pressed="true"] .sw{background:var(--basil)}
.healthy[aria-pressed="true"] .sw::after{transform:translateX(16px);background:var(--surface)}
.chip.hol{border-color:var(--tomato)}
.kind{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.kind::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--basil);flex:none}
.kind.relaxed::before{background:var(--tomato)}
.catpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:560px){.catpick{grid-template-columns:repeat(6,1fr)}}
.star{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700}
.star[aria-pressed="true"]{border-color:#C99A00;background:#FFF4CC;color:#5C4500}
.quick button.on{border-style:solid;border-color:var(--tomato)}
.quick button .rm{margin-left:2px;color:var(--tomato);font-weight:800}
.catpick button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px}
.catpick button span{font-size:26px;line-height:1}
.catpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.steps ol{margin:8px 0 0;gap:10px}
.steps li{padding-left:4px}
.steps li::marker{font-family:var(--f-display);font-weight:800;color:var(--tomato)}
.facts{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink)}
.sticky-act{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-20px - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{border:1px dashed var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.quick button:hover{border-color:var(--tomato)}

/* Plano */
.days{display:flex;flex-direction:column;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:76px 1fr;gap:4px 12px;align-items:start}
.day .d{font-family:var(--f-display);font-weight:600;line-height:1.15;padding-top:6px}
.day .d small{display:block;font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px}
.slots{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot{display:flex;align-items:center;gap:8px;min-width:0}
.slot .lbl{width:58px;flex:none;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.slot .val{flex:1;min-width:0;border:0;background:var(--surface-2);border-radius:10px;padding:8px 10px;text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .val.empty{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:500}
.x{flex:none;border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:18px;line-height:1}
.x:hover{background:var(--surface-2)}

/* Lista estilo Bring */
.addbar{display:flex;gap:8px}
.addbar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.group{display:flex;flex-direction:column;gap:8px}
.group h3{font-size:14px;font-family:var(--f-body);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border:0;border-radius:14px;background:var(--tomato);color:var(--tomato-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 6px;text-align:center;transition:transform .12s}
.tile:active{transform:scale(.95)}
.tile .em{font-size:32px;line-height:1.1}
.tile .nm{font-weight:700;font-size:13px;line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .q{font-size:11px;opacity:.85;line-height:1.1;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tile.done{background:var(--done);color:var(--done-ink)}
.tile .del{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:8px;border:0;background:rgba(0,0,0,.18);color:inherit;font-size:15px;line-height:1;display:grid;place-items:center}
.tile.done .del{background:rgba(0,0,0,.06)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.counts{font-variant-numeric:tabular-nums}

/* Barra de separadores */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-block:6px}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.badge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--tomato);color:var(--tomato-ink);font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}

/* Folha */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:86vh}}
.sheet-head{display:flex;gap:12px;align-items:flex-start}
.sheet-head > div{flex:1;min-width:0}
.ings{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ing{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.ing:first-child{border-top:0}
.ing > span{flex:1;min-width:0}
.ing > span.em{flex:none;font-size:22px;width:28px;text-align:center}
[hidden]{display:none!important}
.ing input{width:22px;height:22px;accent-color:var(--basil);flex:none}
.ing.off span.n{color:var(--muted);text-decoration:line-through}
.ing small{display:block;color:var(--muted);font-size:12px}
.pill{font-size:11px;font-weight:600;color:var(--basil);border:1px solid var(--basil);border-radius:999px;padding:1px 7px;white-space:nowrap}
.when{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.when label,.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}
select,.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.field textarea{min-height:120px;resize:vertical}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
summary{font-weight:700;cursor:pointer}
ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.note{font-size:13px;color:var(--warn)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}

/* Pessoas, votos e doses */
.people{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.people .chip{padding:6px 12px}
.people .chip[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:12px;padding:3px}
.stepper button{border:0;background:var(--surface);border-radius:9px;width:34px;height:34px;font-weight:700;font-size:18px}
.stepper b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.votes{display:flex;flex-direction:column;gap:6px}
.vote-row{display:flex;align-items:center;gap:10px;border:0;background:var(--surface-2);border-radius:10px;padding:8px 10px;text-align:left;width:100%}
.vote-row span{flex:1;min-width:0}
.vote-row small{display:block;color:var(--muted);font-size:12px}
.vote-row b.n{font-variant-numeric:tabular-nums;background:var(--basil);color:var(--basil-ink);border-radius:999px;min-width:28px;text-align:center;padding:2px 8px}
.tag.vote{color:var(--basil);border-color:var(--basil)}
.check{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--basil);flex:none}
.check small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.member{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.member:first-of-type{border-top:0}
.member > div{flex:1;min-width:0}
.member small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.mform{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.slot .val small{font-weight:500;color:var(--muted)}
.slot .val.marmita{background:transparent;border:1px solid var(--line);font-weight:500;cursor:default}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <h1 class="brand">Mesa da <span>Família</span></h1>
  <div class="mode" id="mode"><i></i><span>A ligar…</span></div>
  <button class="x" data-act="family" aria-label="Família, convites e avisos" title="Família, convites e avisos"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/></svg></button>
</div></header>

<main><div class="wrap" id="view"></div></main>

<nav class="tabs" aria-label="Secções"><div class="wrap">
  <button data-tab="sugestoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M12 3v3M8 4.5l1 2M16 4.5l-1 2"/></svg>Sugestões</button>
  <button data-tab="plano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plano</button>
  <button data-tab="lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.5 12.5a1.5 1.5 0 0 1-1.5 1.5H8a1.5 1.5 0 0 1-1.5-1.5Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Lista<span class="badge" id="badge" hidden>0</span></button>
</div></nav>

<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script src="firebase-config.js"></script>
<script type="module">
const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
let initializeApp, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, getDoc, setDoc, deleteDoc, getMessaging, getToken, isSupported, getAuth, signInAnonymously, onAuthStateChanged;
async function loadFirebase(){
  const [a, f, m, u] = await Promise.all([import(FB+'firebase-app.js'), import(FB+'firebase-firestore.js'), import(FB+'firebase-messaging.js'), import(FB+'firebase-auth.js')]);
  ({initializeApp} = a);
  ({initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, getDoc, setDoc, deleteDoc} = f);
  ({getMessaging, getToken, isSupported} = m);
  ({getAuth, signInAnonymously, onAuthStateChanged} = u);
}

/* ---------- Catálogo de ingredientes ---------- */
const CATS = [
  ['hort','Frutas e legumes'],['talho','Carne e peixe'],['lat','Laticínios e ovos'],['pad','Padaria'],

function lookup(name){

}

 {id:'tortilha',t:'Tortilha de batata',m:['jantar'],tags:['vegetariano','rapido'],min:30,ing:['Batatas|600 g','Ovos|8','Cebolas|2','Pimento|1','Alface|1','Azeite|q.b.'],st:['Corte as batatas em lâminas finas e a cebola e o pimento em tiras.','Coza tudo em lume brando em bastante azeite durante 15 minutos, sem deixar fritar.','Escorra e misture com os ovos batidos e sal.','Coza numa frigideira antiaderente, vire com a ajuda de um prato e deixe dourar do outro lado.','Sirva com salada de alface.']},

 {id:'carbonara',t:'Esparguete à carbonara',m:['jantar'],tags:['carne','rapido'],min:20,ing:['Esparguete|400 g','Bacon|200 g','Ovos|3','Queijo parmesão|80 g','Pimenta|q.b.'],st:['Coza o esparguete.','Aloure o bacon em cubos sem gordura.','Bata os ovos com o parmesão e pimenta.','Fora do lume, envolva a massa no bacon e depois nos ovos, com um pouco da água da cozedura, até ficar cremoso.']},
 {id:'bacalhau-grao',t:'Bacalhau com grão',m:['jantar','almoco'],tags:['peixe','rapido'],min:30,ing:['Postas de bacalhau demolhado|4','Grão-de-bico (lata)|2','Ovos|4','Cebola|1','Alho|2 dentes','Salsa|1 molho','Azeite|q.b.'],st:['Coza o bacalhau 10 minutos e os ovos 10 minutos.','Aqueça o grão no líquido da cozedura do bacalhau.','Sirva tudo com cebola e alho picados, salsa e bom azeite.']},
 {id:'peru-cogumelos',t:'Bifinhos de peru com cogumelos',m:['jantar','almoco'],tags:['carne','rapido'],min:25,ing:['Bifes de peru|600 g','Cogumelos|250 g','Natas|200 ml','Cebola|1','Alho|2 dentes','Arroz|300 g'],st:['Ponha o arroz a cozer.','Corte o peru em tiras e aloure.','Junte a cebola, o alho e os cogumelos laminados.','Acrescente as natas e deixe apurar 5 minutos.']},
 {id:'hamburguer-grao',t:'Hambúrgueres de grão',m:['jantar'],tags:['vegetariano','rapido'],min:30,ing:['Grão-de-bico (lata)|2','Cebola|1','Alho|1 dente','Pão ralado|4 c. sopa','Ovos|1','Pão de hambúrguer|4','Alface|1','Tomate|2'],st:['Esmague o grão escorrido com a cebola e o alho picados.','Junte o ovo e o pão ralado e molde 4 hambúrgueres.','Doure na frigideira 4 minutos de cada lado.','Monte no pão com alface e tomate.']},

 {id:'bolonhesa-lentilhas',t:'Bolonhesa de lentilhas',m:['jantar','almoco'],tags:['vegetariano','rapido'],min:35,ing:['Lentilhas|250 g','Esparguete|400 g','Polpa de tomate|1 pacote','Cebola|1','Cenoura|1','Alho|2 dentes','Queijo ralado|1 pacote'],st:['Coza as lentilhas 20 minutos.','Refogue cebola, alho e cenoura ralada.','Junte a polpa de tomate e as lentilhas e apure 10 minutos.','Sirva com esparguete e queijo ralado.']},

 {id:'francesinha',t:'Francesinha',m:['jantar','almoco'],tags:['carne'],min:60,ing:['Pão de forma|8 fatias','Bifes de vaca finos|4','Linguiça|2','Salsichas frescas|4','Fiambre|8 fatias','Queijo|16 fatias','Ovos|4','Cerveja|1 garrafa','Polpa de tomate|1 pacote','Batatas fritas congeladas|1 saco'],st:['Para o molho, ferva a cerveja com a polpa de tomate, um pouco de vinho do Porto se tiver, e piri-piri. Apure 20 minutos e engrosse com farinha.','Grelhe os bifes, a linguiça e as salsichas.','Monte: pão, fiambre, carnes, pão, e cubra com 4 fatias de queijo.','Leve ao forno até o queijo derreter e ponha um ovo estrelado por cima.','Regue com o molho quente e sirva com batatas fritas.']},

 {id:'rojoes',t:'Rojões à minhota',m:['almoco'],tags:['carne'],min:90,ing:['Carne de porco (cachaço)|1 kg','Batatas|800 g','Alho|1 cabeça','Vinho branco|2 copos','Louro|2 folhas','Cominhos|1 c. chá','Colorau|1 c. sopa','Laranja|1'],st:['De véspera, tempere a carne em cubos com vinho, alho, louro, cominhos e colorau.','Aloure a carne em tacho largo, em lume forte, até ficar bem tostada.','Junte a marinada e coza em lume brando 40 minutos.','Frite as batatas aos cubos e envolva no fim.','Sirva com rodelas de laranja.']},
 {id:'arroz-tamboril',t:'Arroz de tamboril',m:['almoco','jantar'],tags:['peixe'],min:60,ing:['Tamboril|1 kg','Camarão|300 g','Arroz carolino|350 g','Tomate|3','Cebola|1','Pimento|1','Coentros|1 molho','Vinho branco|1 copo','Alho|3 dentes'],st:['Coza a cabeça do tamboril e as cascas do camarão para fazer o caldo.','Refogue cebola, alho, pimento e tomate.','Junte o tamboril em cubos, o vinho e o caldo (1,2 L).','Acrescente o arroz e coza 15 minutos; junte o camarão nos últimos 3.','Termine com coentros e sirva malandro.']},

 {id:'quiche-espinafres',t:'Quiche de espinafres e feta',m:['jantar','almoco'],tags:['vegetariano','forno'],min:55,ing:['Massa quebrada|1','Espinafres|300 g','Ovos|4','Natas|200 ml','Queijo feta|150 g','Cebola|1'],st:['Forre uma tarteira com a massa e pique o fundo.','Salteie a cebola e os espinafres até murcharem e escorra bem.','Bata os ovos com as natas, sal e pimenta.','Espalhe os espinafres e o feta na massa e verta os ovos.','Forno a 180 °C durante 35 minutos.']},

const TAGS = {saudavel:'Saudável',rapido:'Rápido',peixe:'Peixe',carne:'Carne',vegetariano:'Vegetariano',sopa:'Sopa',forno:'Forno',airfryer:'Airfryer'};
const SLOTS = {almoco:'Almoço',jantar:'Jantar'};
const CHOICE = [['todos','🍽️','Todas'],['carne','🥩','Carne'],['peixe','🐟','Peixe'],['vegetariano','🥦','Vegetariano'],['airfryer','♨️','Airfryer'],['favoritas','⭐','Favoritas']];

/* ---------- Estado partilhado ---------- */
const COLS = ['items','plan','recipes','members','votes','eaters','favs','quick'];
const S = {items:new Map(), plan:new Map(), recipes:new Map(), members:new Map(), votes:new Map(), eaters:new Map(), favs:new Map(), quick:new Map(), devices:new Map()};
/* Segurança: cada telemóvel entra com uma sessão anónima do Firebase. Só os telemóveis que abriram o convite
   (código da família + chave secreta) ficam registados em families/<código>/devices, e as regras do Firestore
   só deixam esses ler ou alterar os dados da família. */
let mode = 'loading', readOnly = false, fs = null, fbApp = null, auth = null, uid = null, fam = null, famKey = null, unsubs = [], note = null;
const CFG = window.FIREBASE_CONFIG || {};
const configured = !!(CFG.apiKey && !String(CFG.apiKey).startsWith('COLE'));
const LS = 'mesa-familia-local-v1', FKEY = 'mesa-familia-id', KKEY = 'mesa-familia-chave', AKEY = 'mesa-familia-avisos', MEKEY = 'mesa-eu';
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function saveLocal(){ if (mode!=='local') return; ls.set(LS, JSON.stringify(Object.fromEntries(COLS.map(c=>[c,[...S[c]]])))); }
function loadLocal(){ try{ const d = JSON.parse(ls.get(LS)||'null'); if (d) COLS.forEach(c=>{ if (Array.isArray(d[c])) S[c]=new Map(d[c]); }); }catch(e){} }

function put(col,id,data){
  S[col].set(id,data); render();
  if (mode==='local'){ saveLocal(); return Promise.resolve(); }
  return setDoc(doc(fs,'families',fam,col,id), data).catch(writeErr);
}
function del(col,id){
  S[col].delete(id); render();
  if (mode==='local'){ saveLocal(); return Promise.resolve(); }
  return deleteDoc(doc(fs,'families',fam,col,id)).catch(writeErr);
}
function writeErr(e){
  if (e && e.code==='permission-denied') toast('O servidor recusou a alteração. Este telemóvel pode ter perdido o acesso.');
  else if (e && e.code==='resource-exhausted') toast('Atingiu o limite diário gratuito do Firebase. Tente amanhã.');
  else toast('Não foi possível guardar. Verifique a ligação e tente outra vez.');
  console.warn(e);
}

const randomId = n => { const abc='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_'; return Array.from(crypto.getRandomValues(new Uint8Array(n)), b=>abc[b&63]).join(''); };
function parseInvite(text){
  const s = String(text||'').trim();
  const f = s.match(/(?:^|[#&?])f=([A-Za-z0-9_-]{20,64})(?=$|&)/), k = s.match(/(?:^|[#&?])k=([A-Za-z0-9_-]{20,64})(?=$|&)/);
  return f ? {f:f[1], k:k ? k[1] : null} : null;
}
function readFamily(){
  const inv = parseInvite(location.hash);
  if (inv){
    history.replaceState(null,'',location.pathname+location.search);
    if (inv.k){ ls.set(FKEY, inv.f); ls.set(KKEY, inv.k); }
    else if (inv.f!==ls.get(FKEY)){ ls.set(FKEY, inv.f); ls.del(KKEY); }
  }
  return {f:ls.get(FKEY), k:ls.get(KKEY)};
}
const inviteUrl = () => location.origin+location.pathname+'#f='+fam+'&k='+famKey;
const deviceName = () => isIOS ? 'iPhone' : /android/i.test(navigator.userAgent) ? 'Android' : 'Computador';

async function initStore(){
  if (!configured){ mode='local'; loadLocal(); setMode(); render(); return; }
  try{ await loadFirebase(); }
  catch(e){ console.warn(e); mode='local'; loadLocal(); setMode(); render(); toast('Sem ligação. Abra a app outra vez quando tiver rede.'); return; }
  fbApp = initializeApp(CFG);
  fs = initializeFirestore(fbApp, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})});
  auth = getAuth(fbApp);
  try{
    const u = await new Promise(res=>{ const off = onAuthStateChanged(auth, x=>{ off(); res(x); }); });
    uid = u ? u.uid : (await signInAnonymously(auth)).user.uid;
  }catch(e){
    console.warn(e);
    note = e && e.code==='auth/network-request-failed' ? 'offline' : 'auth';
    mode='welcome'; setMode(); render(); return;
  }
  const inv = readFamily();
  if (!inv.f){ mode='welcome'; setMode(); render(); return; }
  if (!inv.k){ note='stale'; mode='welcome'; setMode(); render(); return; }
  enter(inv.f, inv.k);
}
/* Entra na família: se este telemóvel ainda não está registado, regista-se com a chave do convite. */
async function enter(f, k){
  try{
    const snap = await getDoc(doc(fs,'families',f)).catch(e=>{ if (e.code==='permission-denied') return null; throw e; });
    if (!snap) await setDoc(doc(fs,'families',f,'devices',uid), {key:k, t:Date.now(), device:deviceName()});
  }catch(e){
    if (e && e.code==='permission-denied'){ forget('invalid'); return false; }
    console.warn(e); // sem rede: abre com a cópia guardada neste telemóvel
  }
  fam=f; famKey=k; ls.set(FKEY,f); ls.set(KKEY,k); note=null;
  startSync();
  return true;
}
function forget(why){
  unsubs.forEach(u=>u()); unsubs=[];
  Object.keys(S).forEach(c=>S[c]=new Map());
  fam=null; famKey=null; ls.del(FKEY); ls.del(KKEY);
  note=why; mode='welcome'; closeSheet(); setMode(); render();
}
function startSync(){
  unsubs.forEach(u=>u()); unsubs=[];
  mode='live'; setMode(); render();
  const denied = err => { console.warn(err); if (err && err.code==='permission-denied' && mode==='live') forget('revoked'); else toast('Sem acesso aos dados da família neste momento.'); };
  const today = iso(new Date());
  for (const col of [...COLS,'devices']){
    let first = true;
    unsubs.push(onSnapshot(collection(fs,'families',fam,col), snap=>{
      const m = new Map(); snap.docs.forEach(d=>m.set(d.id,d.data())); S[col]=m; render();
      // Votos e "quem come" de dias que já passaram deixam de ser precisos.
      if (first && !snap.metadata?.fromCache && (col==='votes'||col==='eaters')) [...m].filter(([,v])=>v.date && v.date<today).forEach(([id])=>del(col,id));
      first = false;
    }, denied));
  }
  unsubs.push(onSnapshot(doc(fs,'families',fam), d=>{
    const k = d.exists() && d.data().joinKey;
    if (k && k!==famKey){ famKey=k; ls.set(KKEY,k); if (sheet && sheet.refresh) sheet.refresh(); }
  }, denied));
}
async function createFamily(){
  if (!uid) return toast('Ainda a ligar ao servidor. Tente daqui a pouco.');
  const f = randomId(24), k = randomId(32);
  toast('A criar a família…');
  try{
    await setDoc(doc(fs,'families',f), {created:Date.now(), owner:uid, joinKey:k});
    await setDoc(doc(fs,'families',f,'devices',uid), {key:k, t:Date.now(), device:deviceName()});
  }catch(e){ writeErr(e); return; }
  fam=f; famKey=k; ls.set(FKEY,f); ls.set(KKEY,k); note=null;
  startSync(); openFamily();
}
async function joinFamily(text){
  const inv = parseInvite(text);
  if (!inv) return toast('Este link não parece um convite da Mesa da Família.');
  if (!inv.k) return toast('Este convite é antigo. Peça o link novo a quem criou a família.');
  if (!uid) return toast('Ainda a ligar ao servidor. Tente daqui a pouco.');
  if (await enter(inv.f, inv.k)) toast('Entrou na família. Bem-vindo!');
}
/* Troca a chave do convite: os links antigos deixam de servir, quem já entrou continua com acesso. */
function rotateKey(){
  const k = randomId(32);
  return setDoc(doc(fs,'families',fam), {joinKey:k}, {merge:true}).then(()=>{ famKey=k; ls.set(KKEY,k); toast('Convite novo criado. O link antigo deixou de funcionar.'); if (sheet && sheet.refresh) sheet.refresh(); }, writeErr);
}
/* Quem é a pessoa deste telemóvel (para votar) */
function me(){ const d = uid && S.devices.get(uid); const m = (d && d.mid) || ls.get(MEKEY); return m && S.members.has(m) ? m : null; }
function setMe(mid){
  ls.set(MEKEY, mid||'');
  if (mode==='live' && uid && S.devices.has(uid)){ S.devices.set(uid,{...S.devices.get(uid), mid:mid||''}); setDoc(doc(fs,'families',fam,'devices',uid), {mid:mid||''}, {merge:true}).catch(writeErr); }
  render();
}

/* ---------- Avisos e instalação ---------- */
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
let installEvt = null;
addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installEvt = e; if (sheet && sheet.refresh) sheet.refresh(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('sw',e));

async function enableAlerts(){
  if (!configured || !fam) return toast('Os avisos precisam da ligação ao Firebase.');
  const ok = await isSupported().catch(()=>false);
  if (!ok || !('Notification' in window)) return toast(isIOS && !standalone ? 'No iPhone, instale primeiro a app no ecrã principal e abra-a a partir do ícone.' : 'Este navegador não suporta avisos. Experimente o Chrome.');
  const perm = await Notification.requestPermission();
  if (perm!=='granted') return toast('Os avisos ficaram bloqueados. Pode permiti-los nas definições do navegador.');
  try{
    const reg = await navigator.serviceWorker.ready;
    const token = await getToken(getMessaging(fbApp), {vapidKey: window.VAPID_KEY, serviceWorkerRegistration: reg});
    if (!token) throw new Error('sem token');
    await setDoc(doc(fs,'families',fam,'tokens',token), {token, t:Date.now(), device:deviceName()});
    ls.set(AKEY, '1'); toast('Avisos ativados. Recebe uma mensagem por volta das 12h.'); if (sheet && sheet.refresh) sheet.refresh();
  }catch(e){ console.warn(e); toast('Não foi possível ativar os avisos. Confirme a chave VAPID na configuração.'); }
}

  const st = {edit:null, delM:null, rotate:false};
  const members = () => [...S.members].sort((a,b)=>(a[1].t||0)-(b[1].t||0));
  const memberForm = (mid) => { const m = (mid && S.members.get(mid)) || {}; return `
    <form class="mform" id="memberform" autocomplete="off">
      <div class="field"><label for="mf-name">Nome</label><input id="mf-name" required maxlength="30" value="${esc(m.name||'')}" placeholder="Ex.: Ana"></div>

      <div class="field"><label for="mf-likes">Gosta muito de</label><input id="mf-likes" maxlength="200" value="${esc(m.likes||'')}" placeholder="Ex.: bacalhau, massa, frango"></div>
      <div class="muted" style="font-size:12px">Separe por vírgulas. Também pode escrever grupos: marisco, peixe, carne, porco, lactose, glúten, ovo, picante, frutos secos.</div>
      <div class="row"><button class="btn" type="submit">Guardar</button><button class="btn ghost" type="button" data-act="m-cancel">Cancelar</button></div>
    </form>`; };
  const draw = () => {
    const alerts = ls.get(AKEY)==='1' && 'Notification' in window && Notification.permission==='granted';
    const ms = members(), mine = me();
    const devs = [...S.devices].sort((a,b)=>(a[1].t||0)-(b[1].t||0));
    $('#sheet-root').innerHTML = `
    <div class="scrim" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fam-t">
      <div class="sheet-head"><div><div class="eyebrow">Definições</div><h2 id="fam-t">A nossa família</h2></div><button class="x" data-act="close" aria-label="Fechar">×</button></div>
      ${mode==='live' || mode==='local' ? `
      <section class="steps"><h3>Quem somos</h3>
        <p class="muted" style="margin:6px 0 4px">Com as pessoas da casa, as sugestões evitam o que alguém não come, as quantidades ajustam-se a quem janta e cada um pode votar.</p>
        ${ms.map(([id,m])=> st.edit===id ? memberForm(id) : `
          <div class="member"><div><b>${esc(m.name)}</b>${id===mine?' <span class="pill">este telemóvel</span>':''}
            ${m.avoid?`<small>Não come: ${esc(m.avoid)}</small>`:''}${m.likes?`<small>Gosta de: ${esc(m.likes)}</small>`:''}</div>
            ${st.delM===id ? `<button class="btn danger" data-act="m-del-yes" data-id="${esc(id)}">Apagar</button><button class="btn ghost" data-act="m-del-no">Não</button>`
              : `<button class="link" data-act="m-edit" data-id="${esc(id)}">Editar</button><button class="x" data-act="m-del" data-id="${esc(id)}" aria-label="Apagar ${esc(m.name)}">×</button>`}
          </div>`).join('')}
        ${st.edit==='new' ? memberForm(null) : ms.length<12 ? `<button class="btn ghost" style="margin-top:8px" data-act="m-new">+ Adicionar pessoa</button>`:''}
        ${ms.length ? `<div class="field" style="margin-top:12px"><label for="mf-me">Este telemóvel é de</label><select id="mf-me"><option value="">Escolha…</option>${ms.map(([id,m])=>`<option value="${esc(id)}" ${id===mine?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>`:''}
      </section>`:''}
      ${mode==='live' ? `
      <section class="steps"><h3>Convidar a família</h3>
        <p class="muted" style="margin:6px 0 10px">Envie este link só para o grupo da família no WhatsApp. Quem o abrir passa a ver a mesma lista e o mesmo plano.</p>

const GROUPS = {
  marisco:['camarao','ameijoas','mexilhao','polvo','lulas','marisco','sapateira','gambas'],
  peixe:['#peixe'], carne:['#carne'],
  porco:['porco','entrecosto','febras','lombo','chourico','bacon','fiambre','linguica','salsichas','rojoes','farinheira','morcela','toucinho','presunto'],
  lactose:['leite','queijo','natas','manteiga','iogurte','mozarela','parmesao','feta','bechamel','queijo ralado'],
  gluten:['massa','esparguete','pao','farinha','tortilhas','cuscuz','lasanha','pizza','bolachas','cerveja','pao ralado','massa quebrada','folhas de lasanha'],
  ovo:['ovos','ovo','omelete','maionese'], picante:['piri-piri','caril','malagueta','picante'],
  'frutos secos':['noz','nozes','amendoa','amendoim','caju','pinhoes','avela','sesamo']
};
GROUPS.leite = GROUPS.lactose; GROUPS.ovos = GROUPS.ovo; GROUPS.mariscos = GROUPS.marisco;
const wordsOf = s => norm(s||'').split(/[,;\n]+|\s+e\s+/).map(w=>w.trim()).filter(w=>w.length>=3);
function variants(w){
  if (GROUPS[w]) return GROUPS[w];
  const v = new Set([w]);
  if (w.endsWith('oes')) v.add(w.slice(0,-3)+'ao');
  if (w.endsWith('es')) v.add(w.slice(0,-2));
  if (w.endsWith('s')) v.add(w.slice(0,-1));
  return [...v];
}
const reOf = x => new RegExp('(^|[^a-z])'+x.replace(/[-.*+?^${}()|[\]\\]/g,'\\$&')+'(s|es)?([^a-z]|$)');
const recipeText = r => norm(r.t+' | '+(r.ing||[]).map(s=>s.split('|')[0]).join(' | ')).replace(/leite de coco/g,'coco');
function matches(r, text){
  const t = recipeText(r);
  return wordsOf(text).filter(w=>variants(w).some(x=> x.startsWith('#') ? (r.tags||[]).includes(x.slice(1)) : reOf(x).test(t)));
}
const memberIds = () => [...S.members].sort((a,b)=>(a[1].t||0)-(b[1].t||0)).map(([id])=>id);
function eatersFor(pid){
  const all = memberIds(); const e = S.eaters.get(pid);
  if (!e || !Array.isArray(e.mids)) return all;
  return e.mids.filter(m=>S.members.has(m));
}
function peopleFor(pid){
  if (S.members.size) return eatersFor(pid).length;

function conflicts(r, mids){
  return mids.map(id=>{ const m=S.members.get(id); const w = m ? matches(r, m.avoid) : []; return w.length ? {name:m.name, words:w} : null; }).filter(Boolean);
}
const likeScore = (r, mids) => mids.reduce((n,id)=>{ const m=S.members.get(id); return n + (m && matches(r, m.likes).length ? 1 : 0); }, 0);
const conflictText = cs => cs.map(c=>`${c.name} não come ${c.words.join(', ')}`).join('. ');
const nameList = ids => ids.map(id=>S.members.get(id)?.name).filter(Boolean).join(', ');

/* Ajusta as quantidades da receita (feita para 4 pessoas) ao número de doses */
const fmtNum = x => String(Math.round(x*100)/100).replace('.',',');
function scaleQty(q, f){
  if (!q || Math.abs(f-1)<0.01 || /q\.?\s*b/i.test(q)) return q;
  return q.replace(/\([^)]*\)|(\d+(?:[.,]\d+)?)(?:\/(\d+))?(\s*)([A-Za-zçãé.]*)/g, (m, num, den, sp, unit)=>{
    if (!num) return m;
    const base = parseFloat(num.replace(',','.')) / (den ? parseFloat(den) : 1);
    let v = base*f; const u = unit.toLowerCase();
    if (u==='g' || u==='gr' || u==='ml'){
      v = v>=100 ? Math.round(v/50)*50 : Math.max(5, Math.round(v/5)*5);
      if (v>=1000) return fmtNum(v/1000)+sp+(u==='ml'?'l':'kg');
      return fmtNum(v)+sp+unit;
    }
    if (u==='kg' || u==='l') return fmtNum(Math.max(0.25, Math.round(v*4)/4))+sp+unit;
    v = base<1 ? Math.max(0.5, Math.round(v*2)/2) : Math.max(1, Math.round(v));
    return fmtNum(v)+sp+unit;
  });
}
/* Votos: um por pessoa e por refeição, em votes/<dia>_<refeição>_<pessoa> */
function votesFor(pid){
  const [date, slot] = pid.split('_'); const by = new Map();
  for (const v of S.votes.values()){
    if (v.date!==date || v.slot!==slot || !S.members.has(v.mid) || !recipeById(v.recipeId)) continue;
    if (!by.has(v.recipeId)) by.set(v.recipeId, []);
    by.get(v.recipeId).push(v.mid);
  }
  return [...by].map(([id,mids])=>({r:recipeById(id), mids})).sort((a,b)=>b.mids.length-a.mids.length || a.r.t.localeCompare(b.r.t,'pt'));
}

}

function addItem(name, qty, meal){
  if (readOnly) return toast('Não tem permissão para alterar a lista.');
  const key = slug(name); const [e,c] = lookup(name);
  const ex = S.items.get(key);
  if (ex && !ex.bought){
    const meals = meal ? [...new Set([...(ex.meals||[]),meal])] : (ex.meals||[]);
    let q = ex.qty||'';
    if (qty && meal && !(ex.meals||[]).includes(meal)) q = q ? q+' + '+qty : qty;
    else if (qty && !meal && !q) q = qty;
    put('items',key,{...ex,meals,qty:q});
  } else {
    put('items',key,{name:name.trim(),qty:qty||'',emoji:e,cat:c,meals:meal?[meal]:[],bought:false,t:Date.now()});
  }
  return key;
}
function choose(r, date, slot, keys, o={}){
  if (readOnly) return toast('Não tem permissão para alterar o plano.');
  const pid = date+'_'+slot;
  const old = S.plan.get(pid);
  if (old) unplan(pid, true);
  const people = o.people ?? peopleFor(pid), double = !!o.double;
  const f = (people||4)/4*(double?2:1);
  const ings = r.ing.map(parseIng).filter(i=>keys.includes(i.key));
  ings.forEach(i=>addItem(i.n, i.q==='q.b.'?'':scaleQty(i.q,f), r.t));
  put('plan',pid,{date,slot,recipeId:r.id,title:r.t,keys:ings.map(i=>i.key),people,double,t:Date.now()});
  if (!o.silent) toast(ings.length ? `${r.t}: ${ings.length} ingrediente${ings.length>1?'s':''} na lista` : `${r.t} está no plano`);
}
function unplan(pid, silent){
  const p = S.plan.get(pid); if (!p) return;
  let removed = 0;
  (p.keys||[]).forEach(k=>{
    const it = S.items.get(k); if (!it || it.bought) return;
    const meals = (it.meals||[]).filter(m=>m!==p.title);
    if (!meals.length && (it.meals||[]).length){ del('items',k); removed++; }
    else if (meals.length!==(it.meals||[]).length) put('items',k,{...it,meals});
  });
  del('plan',pid);
  if (!silent) toast(removed ? `${p.title} saiu do plano e ${removed} ingrediente${removed>1?'s':''} da lista` : `${p.title} saiu do plano`);
}

function rand(seed){ let x = Math.sin(seed)*10000; return x-Math.floor(x); }
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114; return new Date(y,Math.floor(n/31)-1,(n%31)+1,12); }
const FIXED = {'01-01':'Ano Novo','04-25':'Dia da Liberdade','05-01':'Dia do Trabalhador','06-10':'Dia de Portugal','08-15':'Assunção','10-05':'Implantação da República','11-01':'Dia de Todos os Santos','12-01':'Restauração da Independência','12-08':'Imaculada Conceição','12-25':'Natal'};
function holiday(d){ const f = FIXED[iso(d).slice(5)]; if (f) return f; const off = Math.round((d-easter(d.getFullYear()))/864e5); return off===-2?'Sexta-feira Santa':off===0?'Páscoa':off===60?'Corpo de Deus':null; }
function dayKind(s){
  const d = new Date(s+'T12:00'); const h = holiday(d);
  if (h) return {relaxed:true, label:'Feriado: '+h+'. Sugerimos pratos mais elaborados.'};
  if (d.getDay()===0||d.getDay()===6) return {relaxed:true, label:'Fim de semana. Sugerimos pratos mais elaborados.'};
  return {relaxed:false, label:'Dia útil: escolhe-se só o jantar, com pratos rápidos até 35 minutos.'};
}
const slotsFor = s => dayKind(s).relaxed ? ['almoco','jantar'] : ['jantar'];
const effort = r => r.min ? (r.min<=35?'Rápida':r.min>=60?'Elaborada':'') : '';
/* Receitas escolhidas a menos de 7 dias (antes ou depois) do dia indicado, sem contar a própria refeição. */
function usedNear(date, slot){
  const t = new Date(date+'T12:00').getTime(), m = new Map();
  for (const p of S.plan.values()){
    if (p.date===date && p.slot===slot) continue;
    const d = Math.round(Math.abs(new Date(p.date+'T12:00').getTime()-t)/864e5);
    if (d<7) m.set(p.recipeId, p);
  }
  return m;
}
const hashStr = s => { let h = 7; for (const c of s) h = (h*31 + c.charCodeAt(0)) % 1000003; return h; };
/* Sugestões para uma refeição. A ordem depende só do dia e da refeição, para todos verem as mesmas e poderem votar. */
function suggest(date, slot, o={}){
  const used = usedNear(date, slot);
  const relaxed = dayKind(date).relaxed;
  const mids = eatersFor(date+'_'+slot);
  const filter = o.filter || ui.filter;
  let pool = allRecipes().filter(r=>(r.m||[]).includes(slot));
  if (filter==='favoritas') pool = pool.filter(r=>S.favs.has(r.id));
  else if (filter!=='todos') pool = pool.filter(r=>(r.tags||[]).includes(filter));
  if (ui.healthy) pool = pool.filter(r=>(r.tags||[]).includes('saudavel'));
  const repeated = pool.filter(r=>used.has(r.id)).length;
  pool = pool.filter(r=>!used.has(r.id));
  const ok = pool.filter(r=>!conflicts(r, mids).length);
  const avoided = pool.length - ok.length;
  const seed = hashStr(date+slot) + (o.shuffle ?? ui.shuffle)*7919;
  const fit = r => { const m = r.min || ((r.tags||[]).includes('rapido') ? 25 : 45); return relaxed ? (m>=45?0:1.2) : (m<=35?0:1.2); };
  const list = ok.map(r=>({r,s:rand(seed+hashStr(r.id))+fit(r)-0.6*likeScore(r,mids)-(S.favs.has(r.id)?0.35:0)+(o.penalty?o.penalty(r):0)})).sort((a,b)=>a.s-b.s).map(x=>x.r);
  return {list, repeated, avoided, mids};
}
const mainTag = r => r ? ['peixe','carne','vegetariano'].find(t=>(r.tags||[]).includes(t)) || 'outro' : null;
/* Preenche as refeições vazias dos próximos 7 dias, variando entre carne, peixe e vegetariano */
function planWeek(){
  let n = 0, last = null;
  const mainIng = r => r ? slug((r.ing.find(s=>lookup(s.split('|')[0])[1]==='talho')||r.ing[0]).split('|')[0]).split('-')[0] : null;
  const usedIng = new Set([...S.plan.values()].map(p=>mainIng(recipeById(p.recipeId))));
  for (const d of days()){
    const v = iso(d);
    for (const slot of slotsFor(v)){
      const pid = v+'_'+slot;
      if (S.plan.has(pid)){ last = mainTag(recipeById(S.plan.get(pid).recipeId)); continue; }
      const voted = votesFor(pid)[0];
      const r = voted ? voted.r : suggest(v, slot, {filter:'todos', shuffle:0, penalty: x => (mainTag(x)===last ? 0.9 : 0) + (usedIng.has(mainIng(x)) ? 0.7 : 0)}).list[0];
      if (!r) continue;
      usedIng.add(mainIng(r));
      choose(r, v, slot, r.ing.map(parseIng).filter(i=>i.c!=='desp').map(i=>i.key), {silent:true});
      last = mainTag(r); n++;
    }
  }
  toast(n ? `${n} refeiç${n>1?'ões planeadas':'ão planeada'}. Os ingredientes estão na lista.` : 'A semana já está toda planeada.');
}

      </div>

  <div class="row">

}

function renderPlano(){
  const ds = days();
  const empty = ds.reduce((n,d)=>n+slotsFor(iso(d)).filter(k=>!S.plan.has(iso(d)+'_'+k)).length,0);
  const prevDinner = d => { const y=new Date(d); y.setDate(d.getDate()-1); const p=S.plan.get(iso(y)+'_jantar'); return p && p.double ? p : null; };
  return `
  <div><div class="eyebrow">Próximos 7 dias</div><h2>Plano de refeições</h2></div>
  ${empty ? (ui.planAsk ? `<div class="confirm"><span style="flex:1">Preencher ${empty===1?'a refeição vazia':'as '+empty+' refeições vazias'} com pratos variados, sem repetir${S.members.size?' e sem o que alguém não come':''}, e juntar os ingredientes à lista?</span><button class="btn" data-act="plan-yes">Planear</button><button class="btn ghost" data-act="plan-no">Cancelar</button></div>`
    : `<button class="btn" data-act="plan-ask">✨ Planear a semana com um toque</button>`) : ''}
  <div class="days">${ds.map((d,i)=>{ const v=iso(d); const mm=prevDinner(d); return `
    <div class="day"><div class="d">${dayLabel(d,i)}<small>${d.getDate()} ${MON[d.getMonth()]}</small></div>
      <div class="slots">${mm && !S.plan.has(v+'_almoco') ? `<div class="slot"><span class="lbl">Almoço</span><span class="val marmita">🍱 Marmita: ${esc(mm.title)}</span></div>`:''}${Object.entries(SLOTS).filter(([k])=>slotsFor(v).includes(k)).map(([k,lbl])=>{ const p=S.plan.get(v+'_'+k); return `
        <div class="slot"><span class="lbl">${lbl}</span>
          ${p ? `<button class="val" data-act="open" data-id="${esc(p.recipeId)}" data-date="${v}" data-slot="${k}">${esc(p.title)}${p.people||p.double?` <small>· ${p.people?p.people+' p.':''}${p.double?' 🍱 a dobrar':''}</small>`:''}</button><button class="x" data-act="unplan" data-v="${v}_${k}" aria-label="Retirar ${esc(p.title)} do plano">×</button>`
              : `<button class="val empty" data-act="pick" data-date="${v}" data-slot="${k}">+ Escolher</button>`}
        </div>`;}).join('')}</div>
    </div>`;}).join('')}</div>
  <p class="muted" style="margin:0;font-size:13px">Ao retirar uma refeição do plano, os ingredientes que só eram para ela saem também da lista.</p>`;
}

function tile(it,key,done){
  const tip = (it.meals||[]).length ? 'Para: '+it.meals.join(', ') : '';
  return `<div style="position:relative"><button class="tile${done?' done':''}" style="width:100%" data-act="${done?'rebuy':'buy'}" data-k="${esc(key)}" title="${esc(tip)}" aria-label="${esc(it.name)}${it.qty?', '+esc(it.qty):''}${done?'. Tocar para voltar a pôr na lista':'. Tocar para marcar como comprado'}">
    <span class="em" aria-hidden="true">${esc(it.emoji||'🛒')}</span><span class="nm">${esc(it.name)}</span>${it.qty?`<span class="q">${esc(it.qty)}</span>`:''}
  </button><button class="tile-del del" style="position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:8px;border:0;background:${done?'rgba(0,0,0,.06)':'rgba(0,0,0,.18)'};color:${done?'var(--done-ink)':'var(--tomato-ink)'};font-size:15px;line-height:1" data-act="delete" data-k="${esc(key)}" aria-label="Eliminar ${esc(it.name)}">×</button></div>`;
}
/* Produtos frequentes: os da app mais os que a família juntou, menos os que tirou (guardados em quick/<produto>) */
function quickList(){
  const out = new Map(QUICK.map(q=>[slug(q), q]));
  [...S.quick].sort((a,b)=>(a[1].t||0)-(b[1].t||0)).forEach(([k,v])=>{ if (v.hidden) out.delete(k); else if (v.name) out.set(k, v.name); });
  return [...out].map(([k,name])=>({k,name}));
}
function renderLista(){
  const items = [...S.items].filter(([,it])=>!it.bought);
  const done = [...S.items].filter(([,it])=>it.bought).sort((a,b)=>(b[1].boughtAt||0)-(a[1].boughtAt||0)).slice(0,30);
  const allQ = quickList();
  const quick = ui.qedit ? allQ : allQ.filter(q=>{ const it=S.items.get(slug(q.name)); return !it || it.bought; });
  const groups = CATS.map(([c,l])=>[l, items.filter(([,it])=>(it.cat||'out')===c).sort((a,b)=>a[1].name.localeCompare(b[1].name,'pt'))]).filter(g=>g[1].length);
  return `
  <div class="row" style="justify-content:space-between;align-items:flex-end">
    <div><div class="eyebrow">Lista de compras</div><h2><span class="counts">${items.length}</span> ${items.length===1?'artigo':'artigos'} por comprar</h2></div>
  </div>
  <form class="addbar" id="addform" autocomplete="off">
    <input id="addname" list="ing-list" maxlength="60" placeholder="Adicionar artigo (ex.: Leite)" aria-label="Nome do artigo">
    <button class="btn" type="submit">Adicionar</button>
  </form>
  <datalist id="ing-list">${Object.keys(ING_RAW).map(k=>`<option value="${esc(k.charAt(0).toUpperCase()+k.slice(1))}">`).join('')}</datalist>
  ${groups.length ? groups.map(([l,arr])=>`<section class="group"><h3>${esc(l)}</h3><div class="tiles">${arr.map(([k,it])=>tile(it,k,false)).join('')}</div></section>`).join('')
   : `<div class="empty"><b>A lista está vazia</b>Escolha uma refeição em Sugestões e os ingredientes aparecem aqui, ou adicione um artigo acima.</div>`}
  ${items.length ? `<p class="muted" style="margin:0;font-size:13px">Toque num artigo quando o puser no carrinho. O × elimina-o se não for preciso.</p>`:''}
  <section class="group"><div class="row" style="justify-content:space-between"><h3>Outros produtos</h3><button class="link" data-act="qedit">${ui.qedit?'Concluído':'Editar'}</button></div>
    <div class="muted" style="font-size:13px">${ui.qedit ? 'Toque num produto para o tirar dos frequentes. Vale para toda a família.' : 'Toque para juntar à lista. Para uma compra pontual, escreva-a no campo acima (ex.: Água 6 l).'}</div>
    <div class="quick">${quick.map(q=> ui.qedit
      ? `<button class="on" data-act="qdel" data-k="${esc(q.k)}" data-v="${esc(q.name)}" aria-label="Tirar ${esc(q.name)} dos frequentes"><span aria-hidden="true">${esc(lookup(q.name)[0])}</span>${esc(q.name)}<span class="rm" aria-hidden="true">×</span></button>`
      : `<button data-act="quick" data-v="${esc(q.name)}"><span aria-hidden="true">${esc(lookup(q.name)[0])}</span>${esc(q.name)}</button>`).join('')}</div>
    ${ui.qadd ? `<form class="addbar" id="quickform" autocomplete="off"><input id="quickname" maxlength="40" placeholder="Novo produto frequente (ex.: Fraldas)" aria-label="Novo produto frequente"><button class="btn" type="submit">Juntar</button><button class="btn ghost" type="button" data-act="qadd-no">Cancelar</button></form>`
      : `<button class="link" style="align-self:flex-start" data-act="qadd">+ Novo produto frequente</button>`}
  </section>
  ${done.length ? `<section class="group"><div class="row" style="justify-content:space-between"><h3>Comprados recentemente</h3><button class="link" data-act="clear">Limpar</button></div><div class="tiles">${done.map(([k,it])=>tile(it,k,true)).join('')}</div></section>`:''}`;
}

function render(){
  const v = $('#view');
  const aid = document.activeElement && ['addname','quickname'].includes(document.activeElement.id) ? document.activeElement.id : null;
  const active = aid ? $('#'+aid).value : null;
  v.innerHTML = mode==='welcome' ? renderWelcome() : tab==='plano' ? renderPlano() : tab==='lista' ? renderLista() : renderSugestoes();
  if (active!==null && $('#'+aid)){ $('#'+aid).value = active; $('#'+aid).focus(); }
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===tab?'page':'false'));
  const n = [...S.items.values()].filter(i=>!i.bought).length;
  const b = $('#badge'); b.hidden = !n; b.textContent = n;
  if (sheet && sheet.refresh) keepInputs(sheet.refresh);
}
/* Quando chegam alterações de outro telemóvel, a folha aberta é redesenhada sem perder o que se está a escrever. */
function keepInputs(fn){
  const root = $('#sheet-root');
  const vals = [...root.querySelectorAll('input[id]:not([type=checkbox]),textarea[id]')].map(el=>[el.id, el.value]);
  const act = document.activeElement && root.contains(document.activeElement) ? document.activeElement.id : null;
  fn();
  vals.forEach(([id,v])=>{ const el = document.getElementById(id); if (el) el.value = v; });
  if (act && document.getElementById(act)) document.getElementById(act).focus();
}

/* ---------- Folha de receita ---------- */
let sheet = null;
function closeSheet(){ $('#sheet-root').innerHTML=''; sheet=null; }
function openRecipe(id, date, slot){
  const r = recipeById(id); if (!r) return toast('Esta receita já não existe.');
  const ings = r.ing.map(parseIng);
  const sel = new Set(ings.filter(i=>i.c!=='desp').map(i=>i.key));
  const st = {date:date||ui.date, slot:slot||ui.slot, confirmDel:false, double:null};
  if (!slotsFor(st.date).includes(st.slot)) st.slot = 'jantar';
  const ds = days();
  const draw = () => {
    const pid = st.date+'_'+st.slot; const cur = S.plan.get(pid);
    if (st.double===null) st.double = !!(cur && cur.recipeId===r.id && cur.double);
    const inList = k => { const it=S.items.get(k); return it && !it.bought; };
    const allM = memberIds(), mids = eatersFor(pid), people = peopleFor(pid), mine = me();
    const f = (people||4)/4*(st.double?2:1);
    const cs = conflicts(r, mids);
    const myVote = mine && S.votes.get(pid+'_'+mine);
    const voters = (votesFor(pid).find(v=>v.r.id===r.id)||{mids:[]}).mids;
    $('#sheet-root').innerHTML = `
    <div class="scrim" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
      <div class="sheet-head"><div>
        <div class="eyebrow">${(r.m||[]).map(m=>SLOTS[m]).join(' · ')}${r.custom?' · Receita da família':''}</div>
        <h2 id="sh-t">${esc(r.t)}</h2></div>
        <button class="x" data-act="close" aria-label="Fechar">×</button></div>
      <div class="facts">${r.min?`<span>Tempo <b>${r.min>=120?(r.min/60).toString().replace('.',',')+' h':r.min+' min'}</b></span>`:''}<span>Doses <b>${people} ${people===1?'pessoa':'pessoas'}${st.double?' + marmita':''}</b></span>${effort(r)?`<span>Tipo <b>${effort(r)}</b></span>`:''}<span><b>${ings.length}</b> ingredientes</span></div>
      <div class="when">
        <div><label for="sh-date">Dia</label><select id="sh-date">${ds.map((d,i)=>`<option value="${iso(d)}" ${iso(d)===st.date?'selected':''}>${dayLabel(d,i)}</option>`).join('')}</select></div>
        <div><label for="sh-slot">Refeição</label><select id="sh-slot">${Object.entries(SLOTS).filter(([k])=>slotsFor(st.date).includes(k)).map(([k,v])=>`<option value="${k}" ${k===st.slot?'selected':''}>${v}</option>`).join('')}</select></div>
      </div>
      <div><div class="eyebrow" style="margin-bottom:6px">Quem come</div>
        ${allM.length ? `<div class="people" role="group" aria-label="Quem come">${allM.map(m=>`<button class="chip" data-act="eat" data-pid="${pid}" data-id="${esc(m)}" aria-pressed="${mids.includes(m)}">${esc(S.members.get(m).name)}</button>`).join('')}</div>`
          : `<div class="row"><div class="stepper" role="group" aria-label="Número de pessoas"><button data-act="ppl" data-v="-1" aria-label="Menos uma pessoa">−</button><b>${people}</b><button data-act="ppl" data-v="1" aria-label="Mais uma pessoa">+</button></div><span class="muted" style="font-size:13px">pessoas</span></div>`}
      </div>
      <label class="check"><input type="checkbox" id="sh-double" ${st.double?'checked':''}><span>🍱 Fazer a dobrar<small>Sobra para a marmita do almoço de amanhã. As quantidades duplicam.</small></span></label>
      ${cs.length ? `<div class="note">Atenção: ${esc(conflictText(cs))}.</div>`:''}
      ${cur && cur.recipeId!==r.id ? `<div class="note">Vai substituir ${esc(cur.title)} neste dia.</div>`:''}
      ${(()=>{ const u = usedNear(st.date, st.slot).get(r.id); return u ? `<div class="note">Este prato já está escolhido para ${esc(dayLabelIso(u.date).toLowerCase())} ao ${u.slot==='almoco'?'almoço':'jantar'}. Assim repete-se na mesma semana.</div>` : ''; })()}
      ${cur && cur.recipeId===r.id ? `<div class="note" style="color:var(--basil)">Já está no plano para este dia. Se mudar as pessoas ou a marmita, toque em Escolher para atualizar a lista.</div>`:''}
      <div class="row"><button class="star" data-act="fav" aria-pressed="${S.favs.has(r.id)}">${S.favs.has(r.id) ? '⭐ Favorita da família' : '☆ Marcar como favorita'}</button>
        ${r.custom && r.by && S.members.has(r.by) ? `<span class="muted" style="font-size:13px">💡 Sugerida por ${esc(S.members.get(r.by).name)}</span>`:''}</div>
      ${allM.length ? `<div class="row">
        ${mine ? `<button class="btn ghost" data-act="vote" aria-pressed="${!!(myVote && myVote.recipeId===r.id)}">${myVote && myVote.recipeId===r.id ? '👍 Votou neste (retirar)' : '👍 Votar neste'}</button>`
          : `<label for="sh-me" class="muted" style="font-size:13px">Para votar, diga quem é:</label><select id="sh-me" style="width:auto"><option value="">Escolha…</option>${allM.map(m=>`<option value="${esc(m)}">${esc(S.members.get(m).name)}</option>`).join('')}</select>`}
        ${voters.length ? `<span class="muted" style="font-size:13px">Votos: ${esc(nameList(voters))}</span>`:''}
      </div>`:''}
      <div><h3 style="margin-bottom:4px">Ingredientes${Math.abs(f-1)>0.01?` <span class="muted" style="font-weight:500;font-size:13px">· quantidades para ${people}${st.double?' a dobrar':''}</span>`:''}</h3><div class="muted" style="font-size:13px;margin-bottom:8px">Desmarque o que já tem em casa. Só os marcados vão para a lista.</div>
      <div class="ings">${ings.map(i=>{ const q = scaleQty(i.q, f); return `<label class="ing${sel.has(i.key)?'':' off'}"><span class="em" aria-hidden="true">${esc(i.e)}</span><span><span class="n">${esc(i.n)}</span>${q?`<small>${esc(q)}</small>`:''}</span>${inList(i.key)?'<span class="pill">na lista</span>':''}<input type="checkbox" data-k="${esc(i.key)}" ${sel.has(i.key)?'checked':''} aria-label="${esc(i.n)}"></label>`; }).join('')}</div></div>
      <section class="steps"><h3>Receita</h3>
        ${(r.st||[]).length ? `<ol>${r.st.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>` : `<p class="muted" style="margin:8px 0 0">Esta receita ainda não tem passos de preparação.</p>`}
      </section>
      ${r.custom ? (st.confirmDel ? `<div class="confirm"><span style="flex:1">Apagar esta receita para toda a família?</span><button class="btn danger" data-act="del-recipe-yes">Apagar</button><button class="btn ghost" data-act="del-recipe-no">Cancelar</button></div>` : `<button class="link" style="color:var(--tomato);align-self:flex-start" data-act="del-recipe">Apagar receita</button>`) : ''}
      <div class="sticky-act"><button class="btn" data-act="choose" ${readOnly||!people?'disabled':''}>${people ? `Escolher e adicionar ${sel.size} à lista` : 'Escolha quem come'}</button></div>
    </div></div>`;
  };
  sheet = {
    refresh: draw,
    onChange(e){
      if (e.target.id==='sh-date'){ st.date=e.target.value; st.double=null; if (!slotsFor(st.date).includes(st.slot)) st.slot='jantar'; draw(); }
      else if (e.target.id==='sh-slot'){ st.slot=e.target.value; st.double=null; draw(); }
      else if (e.target.id==='sh-double'){ st.double=e.target.checked; draw(); }
      else if (e.target.id==='sh-me'){ if (e.target.value) setMe(e.target.value); }
      else if (e.target.dataset.k){ e.target.checked ? sel.add(e.target.dataset.k) : sel.delete(e.target.dataset.k); draw(); const el=document.querySelector(`#sheet-root input[data-k="${CSS.escape(e.target.dataset.k)}"]`); el&&el.focus(); }
    },
    onAct(act, a){
      const pid = st.date+'_'+st.slot;
      if (act==='choose'){ choose(r, st.date, st.slot, [...sel], {people:peopleFor(pid), double:st.double}); closeSheet(); ui.date=st.date; ui.slot=st.slot; render(); }
      else if (act==='eat') toggleEater(a.dataset.pid, a.dataset.id);
      else if (act==='ppl'){ const n = Math.min(20, Math.max(1, peopleFor(pid)+Number(a.dataset.v))); setEaters(pid, null, n); }
      else if (act==='vote') vote(pid, r.id);
      else if (act==='fav'){ if (S.favs.has(r.id)){ del('favs', r.id); toast('Já não é favorita'); } else { put('favs', r.id, {t:Date.now(), by:me()||''}); toast('⭐ Marcada como favorita'); } }
      else if (act==='del-recipe'){ st.confirmDel=true; draw(); }
      else if (act==='del-recipe-no'){ st.confirmDel=false; draw(); }
      else if (act==='del-recipe-yes'){ del('recipes', r.id); closeSheet(); toast('Receita apagada'); }
    }
  };
  draw();
}
function toggleEater(pid, mid){
  const cur = eatersFor(pid);
  setEaters(pid, cur.includes(mid) ? cur.filter(m=>m!==mid) : memberIds().filter(m=>m===mid || cur.includes(m)));
}

      <div class="field"><label for="nr-tipo">Tipo de prato</label><select id="nr-tipo"><option value="carne">Carne</option><option value="peixe">Peixe</option><option value="vegetariano">Vegetariano</option><option value="">Outro</option></select></div>
      <div class="row" style="grid-column:1/-1">
        <label class="chip" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);margin:0"><input type="checkbox" id="nr-sau"> Refeição saudável</label>
        <label class="chip" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);margin:0"><input type="checkbox" id="nr-af"> Feita na airfryer</label>
      </div>
      <div class="field"><label for="nr-min">Tempo (minutos)</label><input id="nr-min" type="number" min="5" max="600" step="5" value="30" inputmode="numeric"></div>
    </div>
    <div class="field"><label for="nr-ing">Ingredientes (opcional), um por linha</label><textarea id="nr-ing" maxlength="3000" placeholder="Tamboril - 800 g&#10;Arroz carolino - 300 g&#10;Tomate - 3&#10;Coentros"></textarea><div class="muted" style="font-size:12px;margin-top:4px">Use um traço para separar o nome da quantidade.</div></div>
    <div class="field"><label for="nr-st">Preparação (opcional), um passo por linha</label><textarea id="nr-st" maxlength="6000" style="min-height:90px"></textarea></div>
    <button class="btn" type="submit" ${readOnly?'disabled':''}>Guardar sugestão</button>
  </form></div>`;
  sheet = null;
  $('#recform').addEventListener('submit', e=>{
    e.preventDefault();
    const t = $('#nr-name').value.trim();
    const ing = $('#nr-ing').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const p=l.split(/\s+[-–—]\s+|\s*\|\s*/); return p[0].trim()+'|'+(p[1]||'').trim(); });
    const m = [$('#nr-alm').checked&&'almoco',$('#nr-jan').checked&&'jantar'].filter(Boolean);
    if (!t) return toast('Escreva o nome do prato.');
    if (!m.length) return toast('Escolha almoço, jantar ou ambos.');
    const min = Math.max(5, parseInt($('#nr-min').value,10) || 30);
    const tags = [$('#nr-tipo').value, min<=35 && 'rapido', $('#nr-sau').checked && 'saudavel', $('#nr-af').checked && 'airfryer'].filter(Boolean);
    const by = ($('#nr-by') && $('#nr-by').value) || me() || '';
    const id = 'f-'+slug(t).slice(0,40)+'-'+Date.now().toString(36);
    put('recipes', id, {t, m, tags, min, ing, st:$('#nr-st').value.split('\n').map(s=>s.trim()).filter(Boolean), emoji:'💡', by, t0:Date.now()});
    closeSheet(); toast('Sugestão guardada para toda a família');
  });
  setTimeout(()=>$('#nr-name') && $('#nr-name').focus(), 30);
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e=>{
  const tb = e.target.closest('nav.tabs button');
  if (tb){ tab = tb.dataset.tab; try{ localStorage.setItem('mesa-tab',tab); }catch(_){} render(); window.scrollTo(0,0); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act==='close-bg'){ if (e.target===a) closeSheet(); return; }
  if (act==='close'){ closeSheet(); return; }
  if (sheet && a.closest('#sheet-root')){ sheet.onAct(act, a); return; }
  switch(act){
    case 'slot': ui.slot=a.dataset.v; ui.more=false; render(); break;
    case 'date': ui.date=a.dataset.v; render(); break;
    case 'filter': ui.filter=a.dataset.v; ui.more=false; render(); break;
    case 'shuffle': ui.shuffle++; ui.more=false; render(); break;
    case 'unshuffle': ui.shuffle=0; ui.more=false; render(); break;
    case 'eat': toggleEater(a.dataset.pid, a.dataset.id); break;
    case 'qedit': ui.qedit=!ui.qedit; ui.qadd=false; render(); break;
    case 'qadd': ui.qadd=true; render(); setTimeout(()=>$('#quickname')&&$('#quickname').focus(),30); break;
    case 'qadd-no': ui.qadd=false; render(); break;
    case 'qdel': put('quick', a.dataset.k, {name:a.dataset.v, hidden:true, t:Date.now()}); toast(a.dataset.v+' saiu dos produtos frequentes'); break;
    case 'plan-ask': ui.planAsk=true; render(); break;
    case 'plan-no': ui.planAsk=false; render(); break;
    case 'plan-yes': ui.planAsk=false; planWeek(); break;
    case 'more': ui.more=!ui.more; render(); break;
    case 'open': openRecipe(a.dataset.id, a.dataset.date, a.dataset.slot); break;
    case 'new-recipe': openNewRecipe(); break;
    case 'pick': ui.date=a.dataset.date; ui.slot=a.dataset.slot; tab='sugestoes'; render(); window.scrollTo(0,0); break;
    case 'unplan': if (readOnly) return toast('Não tem permissão para alterar o plano.'); unplan(a.dataset.v); break;
    case 'buy': { if (readOnly) return toast('Não tem permissão para alterar a lista.'); const it=S.items.get(a.dataset.k); if(it) put('items',a.dataset.k,{...it,bought:true,boughtAt:Date.now()}); break; }
    case 'rebuy': { if (readOnly) return toast('Não tem permissão para alterar a lista.'); const it=S.items.get(a.dataset.k); if(it) put('items',a.dataset.k,{...it,bought:false,meals:[],qty:'',t:Date.now()}); break; }
    case 'delete': { if (readOnly) return toast('Não tem permissão para alterar a lista.'); const it=S.items.get(a.dataset.k); del('items',a.dataset.k); if(it) toast(it.name+' eliminado'); break; }
    case 'healthy': ui.healthy=!ui.healthy; ls.set('mesa-saudavel', ui.healthy?'1':'0'); ui.more=false; render(); break;
    case 'create-family': createFamily(); break;
    case 'family': openFamily(); break;
    case 'quick': addItem(a.dataset.v, '', null); toast(a.dataset.v+' adicionado à lista'); break;
    case 'clear': { if (readOnly) return; [...S.items].filter(([,it])=>it.bought).forEach(([k])=>del('items',k)); toast('Comprados recentes limpos'); break; }
  }
});
document.addEventListener('change', e=>{ if (sheet && e.target.closest('#sheet-root')) sheet.onChange(e); });
document.addEventListener('submit', e=>{
  if (e.target.id==='joinform'){ e.preventDefault(); joinFamily($('#joinlink').value); return; }
  if (sheet && sheet.onSubmit && e.target.closest('#sheet-root')){ e.preventDefault(); sheet.onSubmit(e); return; }
  if (e.target.id==='quickform'){
    e.preventDefault();
    const n = $('#quickname').value.trim().slice(0,40); if (!n) return;
    const name = n.charAt(0).toUpperCase()+n.slice(1);
    put('quick', slug(name), {name, t:Date.now()}); ui.qadd=false; render(); toast(name+' juntou-se aos produtos frequentes');
    return;
  }
  if (e.target.id!=='addform') return;
  e.preventDefault();
  const raw = $('#addname').value.trim(); if (!raw) return;
  const m = raw.match(/^(.*?)\s+(\d+[.,]?\d*\s*(?:kg|g|l|ml|un|uni|dúzia|duzia|pacotes?|latas?|x)?)$/i);
  const name = m ? m[1] : raw, qty = m ? m[2] : '';
  addItem(name.charAt(0).toUpperCase()+name.slice(1), qty, null);
  $('#addname').value=''; $('#addname').focus();
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && $('#sheet-root').innerHTML) closeSheet(); });

render();
initStore();
</script>
</body>
</html>
