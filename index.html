<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesa da Família</title>
<meta name="description" content="Receitas para o almoço e jantar da família e lista de compras partilhada.">
<meta name="theme-color" content="#F3F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111612" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mesa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de telemóvel numa coluna (máx. 720px), cabeçalho fixo em cima, separadores em baixo, folhas deslizantes para receitas */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --surface-2:#E7EBE2; --ink:#1C2620; --muted:#5E6B62; --line:#D5DBCF;
  --basil:#2F5D3A; --basil-ink:#FFFFFF; --tomato:#C8432B; --tomato-ink:#FFFFFF; --done:#DCE1D6; --done-ink:#56635A;
  --warn:#9A5B00; --shadow:0 1px 2px rgba(28,38,32,.08),0 6px 18px rgba(28,38,32,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111612; --surface:#1A211C; --surface-2:#242D27; --ink:#E6ECE4; --muted:#9AA79E; --line:#2F3A32;
  --basil:#6FAE7C; --basil-ink:#0E1A11; --tomato:#C24A33; --tomato-ink:#FFFFFF; --done:#232B25; --done-ink:#9AA79E;
  --warn:#E0A44A; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111612; --surface:#1A211C; --surface-2:#242D27; --ink:#E6ECE4; --muted:#9AA79E; --line:#2F3A32;
  --basil:#6FAE7C; --basil-ink:#0E1A11; --tomato:#C24A33; --tomato-ink:#FFFFFF; --done:#232B25; --done-ink:#9AA79E;
  --warn:#E0A44A; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--basil);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0;flex:1}
.brand span{color:var(--tomato)}
.mode{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.mode.live i{background:var(--basil)}
.mode.local i{background:var(--warn)}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:18px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;white-space:nowrap;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 18px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--basil);color:var(--basil-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--tomato);border:1px solid var(--tomato)}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;color:var(--basil);font-weight:600;padding:4px 0}

/* Sugestões */
.today{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.today .em{font-size:30px}
.today > div{flex:1;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.card .em{flex:none;width:56px;height:56px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:30px}
.card > div{min-width:0;flex:1}
.card h3{line-height:1.2}
.meta{font-size:13px;color:var(--muted);margin-top:3px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:4px}
.planned{color:var(--basil);font-weight:600}
.tag.hot{color:var(--tomato);border-color:var(--tomato)}
.tag.ok{color:var(--basil);border-color:var(--basil)}
.healthy{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:700}
.healthy small{grid-column:2;font-weight:500;color:var(--muted);font-size:12px}
.healthy .sw{grid-row:span 2;width:40px;height:24px;border-radius:12px;background:var(--surface-2);position:relative;transition:background .15s}
.healthy .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s}
.healthy[aria-pressed="true"]{border-color:var(--basil)}
.healthy[aria-pressed="true"] .sw{background:var(--basil)}
.healthy[aria-pressed="true"] .sw::after{transform:translateX(16px);background:var(--surface)}
.chip.hol{border-color:var(--tomato)}
.kind{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.kind::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--basil);flex:none}
.kind.relaxed::before{background:var(--tomato)}
.catpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catpick button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px}
.catpick button span{font-size:26px;line-height:1}
.catpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.steps ol{margin:8px 0 0;gap:10px}
.steps li{padding-left:4px}
.steps li::marker{font-family:var(--f-display);font-weight:800;color:var(--tomato)}
.facts{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink)}
.sticky-act{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-20px - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{border:1px dashed var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.quick button:hover{border-color:var(--tomato)}

/* Plano */
.days{display:flex;flex-direction:column;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:76px 1fr;gap:4px 12px;align-items:start}
.day .d{font-family:var(--f-display);font-weight:600;line-height:1.15;padding-top:6px}
.day .d small{display:block;font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px}
.slots{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot{display:flex;align-items:center;gap:8px;min-width:0}
.slot .lbl{width:58px;flex:none;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.slot .val{flex:1;min-width:0;border:0;background:var(--surface-2);border-radius:10px;padding:8px 10px;text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .val.empty{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:500}
.x{flex:none;border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:18px;line-height:1}
.x:hover{background:var(--surface-2)}

/* Lista estilo Bring */
.addbar{display:flex;gap:8px}
.addbar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.group{display:flex;flex-direction:column;gap:8px}
.group h3{font-size:14px;font-family:var(--f-body);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border:0;border-radius:14px;background:var(--tomato);color:var(--tomato-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 6px;text-align:center;transition:transform .12s}
.tile:active{transform:scale(.95)}
.tile .em{font-size:32px;line-height:1.1}
.tile .nm{font-weight:700;font-size:13px;line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .q{font-size:11px;opacity:.85;line-height:1.1;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tile.done{background:var(--done);color:var(--done-ink)}
.tile .del{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:8px;border:0;background:rgba(0,0,0,.18);color:inherit;font-size:15px;line-height:1;display:grid;place-items:center}
.tile.done .del{background:rgba(0,0,0,.06)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.counts{font-variant-numeric:tabular-nums}

/* Barra de separadores */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-block:6px}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.badge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--tomato);color:var(--tomato-ink);font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}

/* Folha */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:86vh}}
.sheet-head{display:flex;gap:12px;align-items:flex-start}
.sheet-head > div{flex:1;min-width:0}
.ings{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ing{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.ing:first-child{border-top:0}
.ing > span{flex:1;min-width:0}
.ing > span.em{flex:none;font-size:22px;width:28px;text-align:center}
[hidden]{display:none!important}
.ing input{width:22px;height:22px;accent-color:var(--basil);flex:none}
.ing.off span.n{color:var(--muted);text-decoration:line-through}
.ing small{display:block;color:var(--muted);font-size:12px}
.pill{font-size:11px;font-weight:600;color:var(--basil);border:1px solid var(--basil);border-radius:999px;padding:1px 7px;white-space:nowrap}
.when{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.when label,.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}
select,.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.field textarea{min-height:120px;resize:vertical}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
summary{font-weight:700;cursor:pointer}
ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.note{font-size:13px;color:var(--warn)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <h1 class="brand">Mesa da <span>Família</span></h1>
  <div class="mode" id="mode"><i></i><span>A ligar…</span></div>
  <button class="x" data-act="family" aria-label="Família, convites e avisos" title="Família, convites e avisos"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/></svg></button>
</div></header>

<main><div class="wrap" id="view"></div></main>

<nav class="tabs" aria-label="Secções"><div class="wrap">
  <button data-tab="sugestoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M12 3v3M8 4.5l1 2M16 4.5l-1 2"/></svg>Sugestões</button>
  <button data-tab="plano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plano</button>
  <button data-tab="lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.5 12.5a1.5 1.5 0 0 1-1.5 1.5H8a1.5 1.5 0 0 1-1.5-1.5Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Lista<span class="badge" id="badge" hidden>0</span></button>
</div></nav>

<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script src="firebase-config.js"></script>

const ING_KEYS = Object.keys(ING_RAW).sort((a,b)=>b.length-a.length);
function lookup(name){

}

/* ---------- Estado partilhado ---------- */
const S = {items:new Map(), plan:new Map(), recipes:new Map()};
/* Os dados de cada família ficam em families/<código>/{items,plan,recipes,tokens} no Firestore.
   O código é aleatório e só é conhecido por quem recebe o convite. */
let mode = 'loading', readOnly = false, fs = null, fbApp = null, fam = null;
const CFG = window.FIREBASE_CONFIG || {};
const configured = !!(CFG.apiKey && !String(CFG.apiKey).startsWith('COLE'));
const LS = 'mesa-familia-local-v1', FKEY = 'mesa-familia-id', AKEY = 'mesa-familia-avisos';
const ls = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
function saveLocal(){ if (mode!=='local') return; ls.set(LS, JSON.stringify({items:[...S.items],plan:[...S.plan],recipes:[...S.recipes]})); }
function loadLocal(){ try{ const d = JSON.parse(ls.get(LS)||'null'); if (d){ S.items=new Map(d.items); S.plan=new Map(d.plan); S.recipes=new Map(d.recipes); } }catch(e){} }

function put(col,id,data){
  S[col].set(id,data); render();
  if (mode==='local'){ saveLocal(); return Promise.resolve(); }
  return setDoc(doc(fs,'families',fam,col,id), data).catch(writeErr);
}
function del(col,id){
  S[col].delete(id); render();
  if (mode==='local'){ saveLocal(); return Promise.resolve(); }
  return deleteDoc(doc(fs,'families',fam,col,id)).catch(writeErr);
}
function writeErr(e){
  if (e && e.code==='permission-denied') toast('O servidor recusou a alteração. Confirme as regras do Firestore.');
  else if (e && e.code==='resource-exhausted') toast('Atingiu o limite diário gratuito do Firebase. Tente amanhã.');
  else toast('Não foi possível guardar. Verifique a ligação e tente outra vez.');
  console.warn(e);
}

function readFamily(){
  const m = location.hash.match(/f=([A-Za-z0-9_-]{20,})/);
  if (m){ ls.set(FKEY, m[1]); history.replaceState(null,'',location.pathname+location.search); return m[1]; }
  return ls.get(FKEY);
}
function newFamilyId(){
  const abc='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_';
  return Array.from(crypto.getRandomValues(new Uint8Array(24)), b=>abc[b&63]).join('');
}
const inviteUrl = () => location.origin+location.pathname+'#f='+fam;

async function initStore(){
  if (!configured){ mode='local'; loadLocal(); setMode(); render(); return; }
  try{ await loadFirebase(); }
  catch(e){ console.warn(e); mode='local'; loadLocal(); setMode(); render(); toast('Sem ligação. Abra a app outra vez quando tiver rede.'); return; }
  fbApp = initializeApp(CFG);
  fs = initializeFirestore(fbApp, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})});
  fam = readFamily();
  if (!fam){ mode='welcome'; setMode(); render(); return; }
  startSync();
}
function startSync(){
  mode='live'; setMode(); render();
  for (const col of ['items','plan','recipes']){
    onSnapshot(collection(fs,'families',fam,col), snap=>{
      const m = new Map(); snap.docs.forEach(d=>m.set(d.id,d.data())); S[col]=m; render();
    }, err=>{ console.warn(col,err); toast('Sem acesso aos dados da família. Confirme o convite e as regras do Firestore.'); });
  }
}
async function createFamily(){
  fam = newFamilyId(); ls.set(FKEY, fam);
  setDoc(doc(fs,'families',fam), {created:Date.now()}).catch(writeErr);
  startSync(); openFamily();
}
function joinFamily(text){
  const m = String(text).match(/f=([A-Za-z0-9_-]{20,})/) || String(text).trim().match(/^([A-Za-z0-9_-]{20,})$/);
  if (!m) return toast('Este link não parece um convite da Mesa da Família.');
  fam = m[1]; ls.set(FKEY, fam); startSync(); toast('Entrou na família. Bem-vindo!');
}

/* ---------- Avisos e instalação ---------- */
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
let installEvt = null;
addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installEvt = e; if (sheet && sheet.refresh) sheet.refresh(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('sw',e));

async function enableAlerts(){
  if (!configured || !fam) return toast('Os avisos precisam da ligação ao Firebase.');
  const ok = await isSupported().catch(()=>false);
  if (!ok || !('Notification' in window)) return toast(isIOS && !standalone ? 'No iPhone, instale primeiro a app no ecrã principal e abra-a a partir do ícone.' : 'Este navegador não suporta avisos. Experimente o Chrome.');
  const perm = await Notification.requestPermission();
  if (perm!=='granted') return toast('Os avisos ficaram bloqueados. Pode permiti-los nas definições do navegador.');
  try{
    const reg = await navigator.serviceWorker.ready;
    const token = await getToken(getMessaging(fbApp), {vapidKey: window.VAPID_KEY, serviceWorkerRegistration: reg});
    if (!token) throw new Error('sem token');
    await setDoc(doc(fs,'families',fam,'tokens',token), {token, t:Date.now(), device:(isIOS?'iPhone':/android/i.test(navigator.userAgent)?'Android':'Computador')});
    ls.set(AKEY, '1'); toast('Avisos ativados. Recebe uma mensagem por volta das 12h.'); if (sheet && sheet.refresh) sheet.refresh();
  }catch(e){ console.warn(e); toast('Não foi possível ativar os avisos. Confirme a chave VAPID na configuração.'); }
}

      </section>` : `<p class="muted">Esta cópia funciona só neste dispositivo porque falta a configuração do Firebase.</p>`}
      <section class="steps"><h3>Instalar no telemóvel</h3>

      </section>
    </div></div>`;
  };
  sheet = {
    refresh: draw, onChange(){},
    async onAct(act){
      if (act==='fam-alerts') enableAlerts();
      else if (act==='fam-install' && installEvt){ installEvt.prompt(); await installEvt.userChoice.catch(()=>{}); installEvt=null; draw(); }

/* ---------- Utilitários ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MON = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function days(n=7){ const out=[]; const t=new Date(); t.setHours(12,0,0,0); for(let i=0;i<n;i++){ const d=new Date(t); d.setDate(t.getDate()+i); out.push(d);} return out; }
function dayLabel(d,i){ return i===0?'Hoje':i===1?'Amanhã':DOW[d.getDay()]+' '+d.getDate(); }
function dayLabelIso(s){ const ds=days(); const i=ds.findIndex(d=>iso(d)===s); if(i>=0) return dayLabel(ds[i],i); const d=new Date(s+'T12:00'); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }

function allRecipes(){
  const custom = [...S.recipes].map(([id,r])=>({...r,id,custom:true}));
  return BASE.concat(custom);
}
function recipeById(id){ return allRecipes().find(r=>r.id===id); }
function parseIng(s){ const [n,q] = s.split('|'); const [e,c] = lookup(n); return {n:n.trim(),q:(q||'').trim(),e,c,key:slug(n)}; }

/* ---------- Ações ---------- */
function addItem(name, qty, meal){
  if (readOnly) return toast('Não tem permissão para alterar a lista.');
  const key = slug(name); const [e,c] = lookup(name);
  const ex = S.items.get(key);
  if (ex && !ex.bought){
    const meals = meal ? [...new Set([...(ex.meals||[]),meal])] : (ex.meals||[]);
    let q = ex.qty||'';
    if (qty && meal && !(ex.meals||[]).includes(meal)) q = q ? q+' + '+qty : qty;
    else if (qty && !meal && !q) q = qty;
    put('items',key,{...ex,meals,qty:q});
  } else {
    put('items',key,{name:name.trim(),qty:qty||'',emoji:e,cat:c,meals:meal?[meal]:[],bought:false,t:Date.now()});
  }
  return key;
}
function choose(r, date, slot, keys){
  if (readOnly) return toast('Não tem permissão para alterar o plano.');
  const pid = date+'_'+slot;
  const old = S.plan.get(pid);
  if (old && old.recipeId!==r.id) unplan(pid, true);
  const ings = r.ing.map(parseIng).filter(i=>keys.includes(i.key));
  ings.forEach(i=>addItem(i.n, i.q==='q.b.'?'':i.q, r.t));
  put('plan',pid,{date,slot,recipeId:r.id,title:r.t,keys:ings.map(i=>i.key),t:Date.now()});
  toast(ings.length ? `${r.t}: ${ings.length} ingrediente${ings.length>1?'s':''} na lista` : `${r.t} está no plano`);
}
function unplan(pid, silent){
  const p = S.plan.get(pid); if (!p) return;
  let removed = 0;
  (p.keys||[]).forEach(k=>{
    const it = S.items.get(k); if (!it || it.bought) return;
    const meals = (it.meals||[]).filter(m=>m!==p.title);
    if (!meals.length && (it.meals||[]).length){ del('items',k); removed++; }
    else if (meals.length!==(it.meals||[]).length) put('items',k,{...it,meals});
  });
  del('plan',pid);
  if (!silent) toast(removed ? `${p.title} saiu do plano e ${removed} ingrediente${removed>1?'s':''} da lista` : `${p.title} saiu do plano`);
}

const ds0 = days();
const ui = { healthy: ls.get('mesa-saudavel')==='1', date: iso(ds0[0]), slot: new Date().getHours()<15 ? 'almoco':'jantar', filter:'todos', seed: Math.random(), more:false };

function rand(seed){ let x = Math.sin(seed)*10000; return x-Math.floor(x); }
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114; return new Date(y,Math.floor(n/31)-1,(n%31)+1,12); }
const FIXED = {'01-01':'Ano Novo','04-25':'Dia da Liberdade','05-01':'Dia do Trabalhador','06-10':'Dia de Portugal','08-15':'Assunção','10-05':'Implantação da República','11-01':'Dia de Todos os Santos','12-01':'Restauração da Independência','12-08':'Imaculada Conceição','12-25':'Natal'};
function holiday(d){ const f = FIXED[iso(d).slice(5)]; if (f) return f; const off = Math.round((d-easter(d.getFullYear()))/864e5); return off===-2?'Sexta-feira Santa':off===0?'Páscoa':off===60?'Corpo de Deus':null; }
function dayKind(s){
  const d = new Date(s+'T12:00'); const h = holiday(d);
  if (h) return {relaxed:true, label:'Feriado: '+h+'. Sugerimos pratos mais elaborados.'};
  if (d.getDay()===0||d.getDay()===6) return {relaxed:true, label:'Fim de semana. Sugerimos pratos mais elaborados.'};
  return {relaxed:false, label:'Dia útil: escolhe-se só o jantar, com pratos rápidos até 35 minutos.'};
}
const slotsFor = s => dayKind(s).relaxed ? ['almoco','jantar'] : ['jantar'];
const effort = r => r.min ? (r.min<=35?'Rápida':r.min>=60?'Elaborada':'') : '';
/* Receitas escolhidas a menos de 7 dias (antes ou depois) do dia indicado, sem contar a própria refeição. */
function usedNear(date, slot){
  const t = new Date(date+'T12:00').getTime(), m = new Map();
  for (const p of S.plan.values()){
    if (p.date===date && p.slot===slot) continue;
    const d = Math.round(Math.abs(new Date(p.date+'T12:00').getTime()-t)/864e5);
    if (d<7) m.set(p.recipeId, p);
  }
  return m;
}
function suggestions(){
  const used = usedNear(ui.date, ui.slot);
  const relaxed = dayKind(ui.date).relaxed;
  let pool = allRecipes().filter(r=>(r.m||[]).includes(ui.slot));
  if (ui.filter!=='todos') pool = pool.filter(r=>(r.tags||[]).includes(ui.filter));
  if (ui.healthy) pool = pool.filter(r=>(r.tags||[]).includes('saudavel'));
  ui.hidden = pool.filter(r=>used.has(r.id)).length;
  pool = pool.filter(r=>!used.has(r.id));
  const fit = r => { const m = r.min || ((r.tags||[]).includes('rapido') ? 25 : 45); return relaxed ? (m>=45?0:1.2) : (m<=35?0:1.2); };
  return pool.map((r,i)=>({r,s:rand(ui.seed*1000+i*7.3+r.id.length)+fit(r)})).sort((a,b)=>a.s-b.s).map(x=>x.r);
}

      ${cur && cur.recipeId!==r.id ? `<div class="note">Vai substituir ${esc(cur.title)} neste dia.</div>`:''}
      ${(()=>{ const u = usedNear(st.date, st.slot).get(r.id); return u ? `<div class="note">Este prato já está escolhido para ${esc(dayLabelIso(u.date).toLowerCase())} ao ${u.slot==='almoco'?'almoço':'jantar'}. Assim repete-se na mesma semana.</div>` : ''; })()}
      ${cur && cur.recipeId===r.id ? `<div class="note" style="color:var(--basil)">Já está no plano para este dia. Pode voltar a adicionar ingredientes.</div>`:''}
      <div><h3 style="margin-bottom:4px">Ingredientes</h3><div class="muted" style="font-size:13px;margin-bottom:8px">Desmarque o que já tem em casa. Só os marcados vão para a lista.</div>
      <div class="ings">${ings.map(i=>`<label class="ing${sel.has(i.key)?'':' off'}"><span class="em" aria-hidden="true">${esc(i.e)}</span><span><span class="n">${esc(i.n)}</span>${i.q?`<small>${esc(i.q)}</small>`:''}</span>${inList(i.key)?'<span class="pill">na lista</span>':''}<input type="checkbox" data-k="${esc(i.key)}" ${sel.has(i.key)?'checked':''} aria-label="${esc(i.n)}"></label>`).join('')}</div></div>
      <section class="steps"><h3>Receita</h3>
        ${(r.st||[]).length ? `<ol>${r.st.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>` : `<p class="muted" style="margin:8px 0 0">Esta receita ainda não tem passos de preparação.</p>`}
      </section>
      ${r.custom ? (st.confirmDel ? `<div class="confirm"><span style="flex:1">Apagar esta receita para toda a família?</span><button class="btn danger" data-act="del-recipe-yes">Apagar</button><button class="btn ghost" data-act="del-recipe-no">Cancelar</button></div>` : `<button class="link" style="color:var(--tomato);align-self:flex-start" data-act="del-recipe">Apagar receita</button>`) : ''}
      <div class="sticky-act"><button class="btn" data-act="choose" ${readOnly?'disabled':''}>Escolher e adicionar ${sel.size} à lista</button></div>
    </div></div>`;
  };
  sheet = {
    refresh: draw,
    onChange(e){
      if (e.target.id==='sh-date'){ st.date=e.target.value; if (!slotsFor(st.date).includes(st.slot)) st.slot='jantar'; draw(); }
      else if (e.target.id==='sh-slot'){ st.slot=e.target.value; draw(); }
      else if (e.target.dataset.k){ e.target.checked ? sel.add(e.target.dataset.k) : sel.delete(e.target.dataset.k); draw(); const el=document.querySelector(`#sheet-root input[data-k="${CSS.escape(e.target.dataset.k)}"]`); el&&el.focus(); }
    },
    onAct(act){
      if (act==='choose'){ choose(r, st.date, st.slot, [...sel]); closeSheet(); ui.date=st.date; ui.slot=st.slot; render(); }
      else if (act==='del-recipe'){ st.confirmDel=true; draw(); }
      else if (act==='del-recipe-no'){ st.confirmDel=false; draw(); }
      else if (act==='del-recipe-yes'){ del('recipes', r.id); closeSheet(); toast('Receita apagada'); }
    }
  };
  draw();
}

function openNewRecipe(){
  const st = {m:new Set([ui.slot])};
  $('#sheet-root').innerHTML = `
  <div class="scrim" data-act="close-bg"><form class="sheet" id="recform" role="dialog" aria-modal="true" aria-labelledby="nr-t">
    <div class="sheet-head"><div><div class="eyebrow">Receita da família</div><h2 id="nr-t">Nova receita</h2></div><button type="button" class="x" data-act="close" aria-label="Fechar">×</button></div>
    <div class="field"><label for="nr-name">Nome</label><input id="nr-name" required placeholder="Ex.: Arroz de tamboril da avó"></div>
    <div class="field"><label>Serve para</label><div class="row">
      <label class="chip" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);margin:0"><input type="checkbox" id="nr-alm" ${st.m.has('almoco')?'checked':''}> Almoço</label>
      <label class="chip" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);margin:0"><input type="checkbox" id="nr-jan" ${st.m.has('jantar')?'checked':''}> Jantar</label>
    </div></div>
    <div class="when">
      <div class="field"><label for="nr-tipo">Tipo de prato</label><select id="nr-tipo"><option value="carne">Carne</option><option value="peixe">Peixe</option><option value="vegetariano">Vegetariano</option><option value="">Outro</option></select></div>
      <label class="chip" style="grid-column:1/-1;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);margin:0;justify-self:start"><input type="checkbox" id="nr-sau"> Refeição saudável</label>
      <div class="field"><label for="nr-min">Tempo (minutos)</label><input id="nr-min" type="number" min="5" max="600" step="5" value="30" inputmode="numeric"></div>
    </div>
    <div class="field"><label for="nr-ing">Ingredientes, um por linha</label><textarea id="nr-ing" required placeholder="Tamboril - 800 g&#10;Arroz carolino - 300 g&#10;Tomate - 3&#10;Coentros"></textarea><div class="muted" style="font-size:12px;margin-top:4px">Use um traço para separar o nome da quantidade.</div></div>
    <div class="field"><label for="nr-st">Preparação (opcional), um passo por linha</label><textarea id="nr-st" style="min-height:90px"></textarea></div>
    <button class="btn" type="submit" ${readOnly?'disabled':''}>Guardar receita</button>
  </form></div>`;
  sheet = null;
  $('#recform').addEventListener('submit', e=>{
    e.preventDefault();
    const t = $('#nr-name').value.trim();
    const ing = $('#nr-ing').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const p=l.split(/\s+[-–—]\s+|\s*\|\s*/); return p[0].trim()+'|'+(p[1]||'').trim(); });
    const m = [$('#nr-alm').checked&&'almoco',$('#nr-jan').checked&&'jantar'].filter(Boolean);
    if (!t || !ing.length) return toast('Escreva o nome e pelo menos um ingrediente.');
    if (!m.length) return toast('Escolha almoço, jantar ou ambos.');
    const min = Math.max(5, parseInt($('#nr-min').value,10) || 30);
    const tags = [$('#nr-tipo').value, min<=35 && 'rapido', $('#nr-sau').checked && 'saudavel'].filter(Boolean);
    const id = 'f-'+slug(t).slice(0,40)+'-'+Date.now().toString(36);
    put('recipes', id, {t, m, tags, min, ing, st:$('#nr-st').value.split('\n').map(s=>s.trim()).filter(Boolean), emoji:'🍽️', t0:Date.now()});
    closeSheet(); toast('Receita guardada para toda a família');
  });
  setTimeout(()=>$('#nr-name') && $('#nr-name').focus(), 30);
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e=>{
  const tb = e.target.closest('nav.tabs button');
  if (tb){ tab = tb.dataset.tab; try{ localStorage.setItem('mesa-tab',tab); }catch(_){} render(); window.scrollTo(0,0); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act==='close-bg'){ if (e.target===a) closeSheet(); return; }
  if (act==='close'){ closeSheet(); return; }
  if (sheet && a.closest('#sheet-root')){ sheet.onAct(act); return; }
  switch(act){
    case 'slot': ui.slot=a.dataset.v; ui.more=false; render(); break;
    case 'date': ui.date=a.dataset.v; render(); break;
    case 'filter': ui.filter=a.dataset.v; ui.more=false; render(); break;
    case 'shuffle': ui.seed=Math.random(); ui.more=false; render(); break;
    case 'more': ui.more=!ui.more; render(); break;
    case 'open': openRecipe(a.dataset.id, a.dataset.date, a.dataset.slot); break;
    case 'new-recipe': openNewRecipe(); break;
    case 'pick': ui.date=a.dataset.date; ui.slot=a.dataset.slot; tab='sugestoes'; render(); window.scrollTo(0,0); break;
    case 'unplan': if (readOnly) return toast('Não tem permissão para alterar o plano.'); unplan(a.dataset.v); break;
    case 'buy': { if (readOnly) return toast('Não tem permissão para alterar a lista.'); const it=S.items.get(a.dataset.k); if(it) put('items',a.dataset.k,{...it,bought:true,boughtAt:Date.now()}); break; }
    case 'rebuy': { if (readOnly) return toast('Não tem permissão para alterar a lista.'); const it=S.items.get(a.dataset.k); if(it) put('items',a.dataset.k,{...it,bought:false,meals:[],qty:'',t:Date.now()}); break; }
    case 'delete': { if (readOnly) return toast('Não tem permissão para alterar a lista.'); const it=S.items.get(a.dataset.k); del('items',a.dataset.k); if(it) toast(it.name+' eliminado'); break; }
    case 'healthy': ui.healthy=!ui.healthy; ls.set('mesa-saudavel', ui.healthy?'1':'0'); ui.more=false; render(); break;
    case 'create-family': createFamily(); break;
    case 'family': openFamily(); break;
    case 'quick': addItem(a.dataset.v, '', null); toast(a.dataset.v+' adicionado à lista'); break;
    case 'clear': { if (readOnly) return; [...S.items].filter(([,it])=>it.bought).forEach(([k])=>del('items',k)); toast('Comprados recentes limpos'); break; }
  }
});
document.addEventListener('change', e=>{ if (sheet && e.target.closest('#sheet-root')) sheet.onChange(e); });
document.addEventListener('submit', e=>{
  if (e.target.id==='joinform'){ e.preventDefault(); joinFamily($('#joinlink').value); return; }
  if (e.target.id!=='addform') return;
  e.preventDefault();
  const raw = $('#addname').value.trim(); if (!raw) return;
  const m = raw.match(/^(.*?)\s+(\d+[.,]?\d*\s*(?:kg|g|l|ml|un|uni|dúzia|duzia|pacotes?|latas?|x)?)$/i);
  const name = m ? m[1] : raw, qty = m ? m[2] : '';
  addItem(name.charAt(0).toUpperCase()+name.slice(1), qty, null);
  $('#addname').value=''; $('#addname').focus();
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && $('#sheet-root').innerHTML) closeSheet(); });

render();
initStore();
</script>
